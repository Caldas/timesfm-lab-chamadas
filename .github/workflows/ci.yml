name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # lets you run the model smoke test by hand (Actions tab -> Run workflow)

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies (no model download is needed for the tests)
        run: pip install -e ".[dev,app]"
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q

  setup-scripts:
    # Runs each OS's real install script, then the environment check (without downloading the model).
    name: Setup script (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: "Ubuntu", os: ubuntu-latest, python: "3.12", cmd: "./scripts/setup_linux.sh" }
          - { label: "Windows", os: windows-latest, python: "3.12", cmd: "./scripts/instalar_windows.bat < /dev/null" }
          - { label: "Mac Apple silicon", os: macos-latest, python: "3.12", cmd: "./scripts/instalar_mac.command < /dev/null" }
          - { label: "Mac Intel", os: macos-15-intel, python: "3.12", cmd: "./scripts/instalar_mac.command < /dev/null" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run setup script
        shell: bash
        run: ${{ matrix.cmd }}
      - name: Run setup script again (must reuse everything and install nothing)
        shell: bash
        run: |
          ${{ matrix.cmd }} 2>&1 | tee second-run.log
          grep -Eq "REUSO\] Depend" second-run.log
          if grep -Eq "Instalando as depend" second-run.log; then
            echo "A segunda execução reinstalou dependências, mas deveria reaproveitar tudo."
            exit 1
          fi

  release-bundle:
    # Builds the slim release bundle and uses it exactly as a user would: unzip, install, open the app.
    name: Release bundle (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: "Ubuntu", os: ubuntu-latest, cmd: "./scripts/setup_linux.sh", python_bin: ".venv/bin/python" }
          - { label: "Windows", os: windows-latest, cmd: "./scripts/instalar_windows.bat < /dev/null", python_bin: ".venv/Scripts/python.exe" }
          - { label: "Mac Apple silicon", os: macos-latest, cmd: "./scripts/instalar_mac.command < /dev/null", python_bin: ".venv/bin/python" }
          - { label: "Mac Intel", os: macos-15-intel, cmd: "./scripts/instalar_mac.command < /dev/null", python_bin: ".venv/bin/python" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the bundle
        shell: bash
        run: python scripts/montar_release.py --saida dist
      - name: Unzip it like a user would
        shell: bash
        run: |
          mkdir bundle-test
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            python -c "import zipfile, glob; zipfile.ZipFile(glob.glob('dist/*.zip')[0]).extractall('bundle-test')"
          else
            unzip -q dist/*.zip -d bundle-test
          fi
          ls bundle-test/*/
      - name: The bundle has no project source code
        shell: bash
        run: |
          cd bundle-test/*/
          for forbidden in src tests .github app pyproject.toml; do
            if [[ -e "$forbidden" ]]; then echo "Não deveria existir no pacote: $forbidden"; exit 1; fi
          done
          ls wheels/
      - name: Install from the bundle
        shell: bash
        run: |
          cd bundle-test/*/
          ${{ matrix.cmd }}
      - name: Install again (must reuse everything)
        shell: bash
        run: |
          cd bundle-test/*/
          ${{ matrix.cmd }} 2>&1 | tee second-run.log
          grep -Eq "REUSO\] Pacote callcenter_lab" second-run.log
          if grep -Eq "Instalando as depend|Instalando o pacote" second-run.log; then
            echo "A segunda execução reinstalou algo, mas deveria reaproveitar tudo."
            exit 1
          fi
      - name: Open the interface from the bundle
        shell: bash
        run: |
          cd bundle-test/*/
          ${{ matrix.python_bin }} -m callcenter_lab --server.headless true --server.port 8765 > app.log 2>&1 &
          APP_PID=$!
          ok=no
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8765/_stcore/health | grep -q ok; then ok=yes; break; fi
            sleep 2
          done
          kill $APP_PID 2>/dev/null || true
          if [[ "$ok" != "yes" ]]; then echo "A interface não subiu"; cat app.log; exit 1; fi
      - name: The interface sees the sample dataset
        shell: bash
        run: |
          cd bundle-test/*/
          ${{ matrix.python_bin }} - <<'EOF'
          from pathlib import Path
          import callcenter_lab
          from streamlit.testing.v1 import AppTest
          at = AppTest.from_file(str(Path(callcenter_lab.__file__).with_name("app.py")), default_timeout=60).run()
          assert not at.exception, at.exception
          options = [str(o).replace("\\", "/") for o in at.selectbox[0].options]
          assert any(o.endswith("samples/chamadas_sinteticas.csv") for o in options), options
          print("ok:", options)
          EOF
      - name: Size a staffing plan and validate it by simulation, from the bundle
        shell: bash
        run: |
          cd bundle-test/*/
          ${{ matrix.python_bin }} - <<'EOF'
          import pandas as pd
          from callcenter_lab.wfm import StaffingConfig, build_plan, simulate_replications

          df = pd.read_csv("data/samples/chamadas_sinteticas.csv", parse_dates=["timestamp"])
          day = df.set_index("timestamp")["calls_offered"].astype(float).loc["2024-05-17"]
          plan = build_plan(day, StaffingConfig())
          assert plan["agents"].max() > 0
          sim = simulate_replications(
              plan["calls"].to_numpy(), plan["agents"].to_numpy(), plan["aht_seconds"].to_numpy(), 30, n_replications=3
          )
          print("ok:", int(plan["agents"].max()), "agents,", round(sim.overall["service_level_pct"][0], 1), "% simulated")
          EOF
      - name: Generate a roster (MILP solver) and an Excel file, from the bundle
        shell: bash
        run: |
          cd bundle-test/*/
          ${{ matrix.python_bin }} - <<'EOF'
          import pandas as pd
          from callcenter_lab.wfm import StaffingConfig, build_plan, build_workbook, example_templates, optimize_roster

          df = pd.read_csv("data/samples/chamadas_sinteticas.csv", parse_dates=["timestamp"])
          day = df.set_index("timestamp")["calls_offered"].astype(float).loc["2024-05-17"]
          config = StaffingConfig()
          plan = build_plan(day, config)
          roster = optimize_roster(plan["scheduled"], example_templates(), 30)
          assert len(roster.shifts) > 0 and roster.coverage["shortfall"].sum() == 0, roster.summary()
          workbook = build_workbook(config=config, plan=plan, roster=roster)
          assert workbook[:2] == b"PK" and len(workbook) > 5000
          print("ok:", roster.headcount, "people,", roster.status, "-", len(workbook), "bytes of Excel")
          EOF
      - name: Queues with skills, events and day follow-up, from the bundle
        shell: bash
        run: |
          cd bundle-test/*/
          ${{ matrix.python_bin }} - <<'EOF'
          import pandas as pd

          from callcenter_lab.events import events_to_covariates, load_events
          from callcenter_lab.intraday import deviation_alerts, plan_vs_actual
          from callcenter_lab.loading import split_by_queue
          from callcenter_lab.synthetic import QUEUE_AHT_SECONDS
          from callcenter_lab.wfm import StaffingConfig, compare_pooling

          df = pd.read_csv("data/samples/chamadas_sinteticas_filas.csv")
          queues = split_by_queue(df, "timestamp", "calls_offered", "queue", "30min")
          day = {name: series.loc["2024-05-14"].iloc[16:40] for name, series in queues.items()}
          result = compare_pooling(day, StaffingConfig(), QUEUE_AHT_SECONDS, n_replications=3, seed=1)
          separate, pooled = result.summary.loc["Equipes separadas", "agent_hours"], result.summary.loc["Equipe cruzada", "agent_hours"]
          assert pooled < separate, result.summary

          events = load_events("data/samples/eventos/eventos_exemplo.csv")
          kinds, covariates = events_to_covariates(events, pd.date_range("2024-05-24", periods=96, freq="30min"), drop_empty=True)
          assert kinds == ["campanha"] and covariates.shape == (1, 96)

          index = pd.date_range("2024-05-24 08:00", periods=4, freq="30min")
          plan = pd.DataFrame({"point": 100.0, "lower": 80.0, "upper": 120.0}, index=index)
          table = plan_vs_actual(plan, pd.Series([150.0, 160.0, 170.0, 100.0], index=index))
          assert len(deviation_alerts(table, 3)) == 1
          print("ok: pooling saves", round(100 * (separate - pooled) / separate), "% of agent hours;", kinds, "events;", len(table), "intervals followed")
          EOF

  setup-bare-ubuntu:
    # A fresh Ubuntu with no Python at all: the script must offer/perform the apt install itself.
    name: Setup script (bare Ubuntu, no Python)
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Confirm there is no Python
        run: '! command -v python3'
      - name: Run setup script with --yes (installs Python via apt)
        run: bash ./scripts/setup_linux.sh --yes

  model-smoke-test:
    # Manual only: downloads the TimesFM 3.0 weights and runs one real forecast on each OS.
    if: github.event_name == 'workflow_dispatch'
    name: Real forecast (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: "Ubuntu", os: ubuntu-latest, cmd: "./scripts/setup_linux.sh", venv_python: ".venv/bin/python" }
          - { label: "Windows", os: windows-latest, cmd: "powershell -ExecutionPolicy Bypass -File scripts/setup_windows.ps1", venv_python: ".venv\\Scripts\\python.exe" }
          - { label: "Mac Apple silicon", os: macos-latest, cmd: "./scripts/setup_mac.sh", venv_python: ".venv/bin/python" }
          - { label: "Mac Intel", os: macos-15-intel, cmd: "./scripts/setup_mac.sh", venv_python: ".venv/bin/python" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run setup script
        run: ${{ matrix.cmd }}
      - name: Load the model and forecast
        run: ${{ matrix.venv_python }} scripts/verificar_ambiente.py --com-modelo
